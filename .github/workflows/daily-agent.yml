name: Daily Sports EV Agent
on:
  workflow_dispatch:
  schedule:
    # Beijing time 09:00 and 14:00; low-frequency public-page collection
    - cron: '0 1 * * *'
    - cron: '0 6 * * *'
permissions:
  contents: write
jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run football EV agent
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python agent.py
      - name: Persist dashboards and research snapshots
        run: |
          git config user.name "Sports EV Agent"
          git config user.email "actions@github.com"
          git add docs/index.html data/
          git diff --cached --quiet || (git commit -m "Persist football odds, model and research snapshots" && git push)
